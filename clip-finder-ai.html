<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切り抜きファインダーAI - Clip Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .wrap{ grid-template-columns: 360px 1fr; }
  @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } }
  input[type=text], textarea, select{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:6px; font-family:'Noto Sans JP', sans-serif; font-size:13px; resize:vertical;
  }
  textarea{ min-height:110px; line-height:1.5; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .progress{ font-size:11px; color:var(--gold); font-family:'JetBrains Mono', monospace; margin-top:8px; min-height:14px; }
  .section-label{ margin:0 0 14px; }
  .clipcard{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px;
    display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start;
  }
  .score{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; flex-shrink:0;
    border:2px solid var(--accent); color:var(--accent);
  }
  .score.high{ border-color:var(--gold); color:var(--gold); }
  .clip-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .clip-time{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--sub); }
  .clip-title{ font-weight:700; font-size:14.5px; margin:0; }
  .clip-reason{ font-size:13px; color:#c7c5c1; line-height:1.65; margin:0 0 8px; }
  .clip-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .clip-tags span{ font-size:10.5px; color:var(--cyan); background:var(--cyan-dim); padding:3px 8px; border-radius:4px; font-family:'JetBrains Mono', monospace; }
</style>
</head>
<body>

<div class="topbar">
  <div class="rec"></div>
  <h1>Clip Finder AI</h1>
  <div class="tag">v1 / 切り抜き箇所提案</div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="field">
      <label>動画ファイル (任意・フレーム解析用)</label>
      <div class="file-drop" id="videoDrop">
        クリックして動画を選択
        <input type="file" id="videoInput" accept="video/*">
        <div class="file-name" id="videoName"></div>
      </div>
    </div>
    <div class="asr-box">
      <label>動画から自動文字起こし (日本語 / 実験的)</label>
      <select id="asrModel">
        <option value="Xenova/whisper-tiny">軽量 (速いが精度低め)</option>
        <option value="Xenova/whisper-base" selected>標準 (バランス型)</option>
        <option value="Xenova/whisper-small">高精度 (重い・時間がかかる)</option>
      </select>
      <div style="height:8px;"></div>
      <button class="sub-btn" id="transcribeBtn">動画から文字起こしを生成</button>
      <div class="asr-progress" id="asrProgress">初回はモデルのダウンロードに数十秒〜数分かかります(以降はブラウザにキャッシュされます)。処理はすべて端末内で行われ、動画はどこにも送信されません。</div>
    </div>
    <div class="field">
      <label>字幕/文字起こしファイル (.srt / .vtt / .txt)</label>
      <div class="file-drop" id="subDrop">
        クリックして字幕ファイルを選択
        <input type="file" id="subInput" accept=".srt,.vtt,.txt">
        <div class="file-name" id="subName"></div>
      </div>
    </div>
    <div class="field">
      <label>または直接ペースト (SRT/VTT形式 or 「[mm:ss] テキスト」形式)</label>
      <textarea id="transcriptText" placeholder="00:00:01,000 --> 00:00:04,000&#10;やばい、これ絶対バグってる&#10;&#10;00:00:04,500 --> 00:00:07,000&#10;え、うそでしょ！？"></textarea>
    </div>
    <div class="field">
      <label>ジャンル/文脈 (任意)</label>
      <input type="text" id="genre" placeholder="例: VTuber切り抜き, 逆再生ゲーム企画">
    </div>
    <button class="gen-btn" id="genBtn">切り抜き箇所を提案する</button>
    <div class="progress" id="progress"></div>
    <div class="hint">動画を選ぶとフレーム画像を自動で数枚抽出し、字幕と合わせてAIに解析させます。字幕だけでも解析できます。</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="empty">左で文字起こし(必須)と動画(任意)を用意して<br>「切り抜き箇所を提案する」を押してください</div>
  </div>
</div>

<video id="hiddenVideo" muted playsinline></video>
<canvas id="hiddenCanvas"></canvas>

<script src="shared/nav.js"></script>
<script src="shared/api-client.js"></script>
<script src="shared/whisper.js"></script>
<script>
const videoDrop = document.getElementById('videoDrop');
const videoInput = document.getElementById('videoInput');
const videoName = document.getElementById('videoName');
const subDrop = document.getElementById('subDrop');
const subInput = document.getElementById('subInput');
const subName = document.getElementById('subName');
const transcriptText = document.getElementById('transcriptText');
const genBtn = document.getElementById('genBtn');
const progress = document.getElementById('progress');
const resultArea = document.getElementById('resultArea');
const hiddenVideo = document.getElementById('hiddenVideo');
const hiddenCanvas = document.getElementById('hiddenCanvas');
const transcribeBtn = document.getElementById('transcribeBtn');
const asrProgress = document.getElementById('asrProgress');
const asrModelSelect = document.getElementById('asrModel');
const ASR_DEFAULT_HINT = asrProgress.textContent;

let videoFile = null;

videoInput.addEventListener('change', async () => {
  videoFile = videoInput.files[0];
  videoName.textContent = videoFile ? videoFile.name : '';
  asrProgress.textContent = ASR_DEFAULT_HINT;
  document.querySelectorAll('#videoDrop .size-warn').forEach(el => el.remove());
  if(videoFile){
    const warnings = await WhisperUtil.checkVideoSafety(videoFile);
    if(warnings.length > 0){
      const div = document.createElement('div');
      div.className = 'size-warn';
      div.innerHTML = '⚠ ' + warnings.map(escapeHtml).join('<br>⚠ ');
      videoName.after(div);
    }
  }
});

subDrop.addEventListener('click', () => subInput.click());

subInput.addEventListener('change', async () => {
  const f = subInput.files[0];
  if(!f) return;
  subName.textContent = f.name;
  const txt = await f.text();
  transcriptText.value = txt;
});

function parseTimeToSeconds(str){
  // supports 00:00:01,000 / 00:00:01.000 / 00:01
  const parts = str.trim().split(':');
  if(parts.length === 3){
    const [h,m,sRaw] = parts;
    const s = parseFloat(sRaw.replace(',', '.'));
    return (+h)*3600 + (+m)*60 + s;
  } else if(parts.length === 2){
    const [m,sRaw] = parts;
    const s = parseFloat(sRaw.replace(',', '.'));
    return (+m)*60 + s;
  }
  return parseFloat(str) || 0;
}

function parseTranscript(raw){
  const lines = raw.split('\n');
  const cues = [];
  const timeLineRe = /(\d{1,2}:\d{2}(?::\d{2})?[.,]?\d{0,3})\s*-->\s*(\d{1,2}:\d{2}(?::\d{2})?[.,]?\d{0,3})/;
  const bracketRe = /^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.*)$/;

  let i = 0;
  while(i < lines.length){
    const line = lines[i].trim();
    const tm = line.match(timeLineRe);
    if(tm){
      const start = parseTimeToSeconds(tm[1]);
      const end = parseTimeToSeconds(tm[2]);
      let textBuf = [];
      i++;
      while(i < lines.length && lines[i].trim() !== '' && !timeLineRe.test(lines[i])){
        textBuf.push(lines[i].trim());
        i++;
      }
      cues.push({ start, end, text: textBuf.join(' ') });
      continue;
    }
    const bm = line.match(bracketRe);
    if(bm){
      const start = parseTimeToSeconds(bm[1]);
      cues.push({ start, end: start + 3, text: bm[2] });
    }
    i++;
  }
  return cues;
}

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

transcribeBtn.addEventListener('click', async () => {
  if(!videoFile){
    asrProgress.textContent = '先に「動画ファイル」を選択してください。';
    return;
  }
  transcribeBtn.disabled = true;
  genBtn.disabled = true;
  try{
    const { lines, rawText } = await WhisperUtil.transcribeVideo(videoFile, {
      modelName: asrModelSelect.value,
      onStatus: (s) => { asrProgress.textContent = s; },
    });

    if(lines.length === 0 && rawText){
      transcriptText.value = `[0:00] ${rawText}`;
    } else {
      transcriptText.value = lines.map(l => `[${fmtTime(l.time)}] ${l.text}`).join('\n');
    }
    asrProgress.textContent = `完了: ${lines.length || 1}セグメントを生成しました。内容を確認・修正してから切り抜き提案を実行してください。`;
  }catch(err){
    asrProgress.textContent = `文字起こしに失敗しました: ${err.message}`;
  }finally{
    transcribeBtn.disabled = false;
    genBtn.disabled = false;
  }
});

async function extractFrames(file, maxFrames = 8){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    hiddenVideo.src = url;
    hiddenVideo.onloadedmetadata = async () => {
      const duration = hiddenVideo.duration;
      const count = Math.min(maxFrames, Math.max(2, Math.floor(duration / 8)));
      const step = duration / (count + 1);
      const frames = [];
      const ctx = hiddenCanvas.getContext('2d');
      hiddenCanvas.width = 480;
      hiddenCanvas.height = Math.round(480 * (hiddenVideo.videoHeight / hiddenVideo.videoWidth || 0.5625));

      for(let k = 1; k <= count; k++){
        const t = step * k;
        await new Promise((res) => {
          const onSeeked = () => {
            hiddenVideo.removeEventListener('seeked', onSeeked);
            ctx.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const dataUrl = hiddenCanvas.toDataURL('image/jpeg', 0.55);
            frames.push({ time: t, data: dataUrl.split(',')[1] });
            res();
          };
          hiddenVideo.addEventListener('seeked', onSeeked);
          hiddenVideo.currentTime = t;
        });
        progress.textContent = `フレーム抽出中... (${k}/${count})`;
      }
      URL.revokeObjectURL(url);
      resolve(frames);
    };
  });
}

genBtn.addEventListener('click', async () => {
  const raw = transcriptText.value.trim();
  if(!raw){
    resultArea.innerHTML = '<div class="empty err">字幕/文字起こしテキストが必要です。</div>';
    return;
  }
  const genre = document.getElementById('genre').value.trim();
  const cues = parseTranscript(raw);
  if(cues.length === 0){
    resultArea.innerHTML = '<div class="empty err">タイムスタンプを認識できませんでした。SRT/VTT形式か「[mm:ss] テキスト」形式で入力してください。</div>';
    return;
  }

  genBtn.disabled = true;
  progress.textContent = '';
  resultArea.innerHTML = '<div class="loading">解析中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  let frames = [];
  if(videoFile){
    try{
      frames = await extractFrames(videoFile);
    }catch(e){
      progress.textContent = 'フレーム抽出に失敗しました(字幕のみで解析します)';
    }
  }

  const transcriptForPrompt = cues.map(c => `[${fmtTime(c.start)}-${fmtTime(c.end)}] ${c.text}`).join('\n');

  const contentBlocks = [];
  contentBlocks.push({
    type: "text",
    text: `あなたはショート動画の切り抜き専門の編集プランナーです。以下のタイムスタンプ付き文字起こしを読み、切り抜きショート動画に向いている箇所を最大6箇所提案してください。
ジャンル/文脈: ${genre || '(指定なし)'}

文字起こし:
${transcriptForPrompt}

${frames.length > 0 ? '参考として、動画から抽出したフレーム画像も添付します(各画像のタイムスタンプは前後してテキストで示します)。表情や画面の変化など視覚的な見どころの参考にしてください。' : ''}

必ず以下のJSON形式のみで出力してください。前置き、説明、コードブロック記号は一切付けないでください。

{
  "clips": [
    {
      "start": "0:12",
      "end": "0:28",
      "score": 8,
      "title": "切り抜きタイトル案",
      "reason": "なぜこの箇所が切り抜きに向いているか、文字起こしの内容に基づいた具体的な理由",
      "tags": ["テロップ案", "効果音/BGM案"]
    }
  ]
}

scoreは1-10でバズりやすさの目安。文字起こしの内容(驚き・感情の起伏・オチ・名言・ハプニングなど)を根拠にしてください。`
  });

  frames.forEach(f => {
    contentBlocks.push({ type: "text", text: `--- フレーム (${fmtTime(f.time)}) ---` });
    contentBlocks.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: f.data } });
  });

  progress.textContent = 'AIが解析中...';

  const CLIPS_SCHEMA = {
    type: "object",
    properties: {
      clips: {
        type: "array",
        items: {
          type: "object",
          properties: {
            start: { type: "string" },
            end: { type: "string" },
            score: { type: "integer" },
            title: { type: "string" },
            reason: { type: "string" },
            tags: { type: "array", items: { type: "string" } }
          },
          required: ["start", "end", "score", "title", "reason", "tags"],
          additionalProperties: false
        }
      }
    },
    required: ["clips"],
    additionalProperties: false
  };

  try{
    const text = await AnthropicAPI.createMessage({
      model: "claude-sonnet-5",
      max_tokens: 4000,
      messages: [{ role: "user", content: contentBlocks }],
      output_config: { format: { type: "json_schema", schema: CLIPS_SCHEMA } }
    });
    const result = AnthropicAPI.parseJson(text);
    renderResult(result);
    progress.textContent = '';
  }catch(err){
    resultArea.innerHTML = `<div class="empty err">生成に失敗しました: ${escapeHtml(err.message)}</div>`;
    progress.textContent = '';
  }finally{
    genBtn.disabled = false;
  }
});

function renderResult(result){
  const clips = (result.clips || []).slice().sort((a,b) => (b.score||0) - (a.score||0));
  let html = '<div class="section-label">// Suggested Clips (score順)</div>';
  clips.forEach(c => {
    const isHigh = (c.score||0) >= 8;
    html += `<div class="clipcard">
      <div class="score ${isHigh ? 'high' : ''}">${c.score ?? '-'}</div>
      <div>
        <div class="clip-head">
          <span class="clip-time">${escapeHtml(c.start||'')} - ${escapeHtml(c.end||'')}</span>
          <p class="clip-title">${escapeHtml(c.title||'')}</p>
        </div>
        <p class="clip-reason">${escapeHtml(c.reason||'')}</p>
        <div class="clip-tags">${(c.tags||[]).map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div>
      </div>
    </div>`;
  });
  resultArea.innerHTML = html || '<div class="empty">候補が見つかりませんでした。</div>';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

</body>
</html>
