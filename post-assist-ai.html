<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テロップ/SE/BGM選定AI - Post Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .wrap{ grid-template-columns: 360px 1fr; }
  @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } }
  input[type=text], textarea, select{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:6px; font-family:'Noto Sans JP', sans-serif; font-size:13px; resize:vertical;
  }
  textarea{ min-height:130px; line-height:1.5; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .section-label{ margin:0 0 14px; }

  .ruler{ position:relative; height:20px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  .ruler span{ position:absolute; top:0; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--sub); transform:translateX(-50%); }

  .track{ position:relative; height:40px; margin-bottom:2px; background:var(--panel); border-radius:4px; }
  .track-label{ position:absolute; left:8px; top:50%; transform:translateY(-50%); font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--sub); z-index:2; pointer-events:none; }
  .marker{ position:absolute; top:6px; width:10px; height:10px; border-radius:50%; transform:translateX(-50%); cursor:default; }
  .marker.telop{ background:var(--accent); box-shadow:0 0 6px var(--accent); }
  .marker.sfx{ background:var(--gold); box-shadow:0 0 6px var(--gold); }
  .tracks-wrap{ margin-bottom:32px; }

  .list-block{ margin-bottom:26px; }
  .row{ display:grid; grid-template-columns:70px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:start; }
  .row:last-child{ border-bottom:none; }
  .row-time{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sub); padding-top:2px; }
  .row-text{ font-size:13.5px; line-height:1.6; margin:0 0 4px; font-weight:700; }
  .row-note{ font-size:12px; color:#c7c5c1; line-height:1.6; margin:0; }
  .style-tag{ display:inline-block; font-size:10px; font-family:'JetBrains Mono', monospace; padding:2px 7px; border-radius:4px; margin-left:8px; vertical-align:middle; }
  .style-tag.emphasis{ background:var(--accent-dim); color:var(--accent); }
  .style-tag.normal{ background:var(--panel2); color:var(--sub); }
  .style-tag.tsukkomi{ background:var(--gold-dim); color:var(--gold); }

  .bgm-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
  .bgm-head{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .bgm-chip{ font-size:12px; background:var(--cyan-dim); color:var(--cyan); padding:5px 12px; border-radius:20px; }
  .bgm-card p{ font-size:13px; color:#c7c5c1; line-height:1.7; margin:6px 0; }
  .bgm-section{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sub); }
</style>
</head>
<body>

<div class="topbar">
  <div class="rec"></div>
  <h1>Post Assist AI</h1>
  <div class="tag">v1 / テロップ・SE・BGM選定</div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="field">
      <label>切り抜き動画の文字起こし (タイムスタンプ付き・必須)</label>
      <textarea id="transcriptText" placeholder="[0:00] やばい、これ絶対バグってる&#10;[0:03] え、うそでしょ！？&#10;[0:07] ちょっと待って、もう一回見せて"></textarea>
      <div class="hint">SRT/VTT形式、または「[mm:ss] テキスト」形式に対応しています。</div>
    </div>
    <div class="field">
      <label>ジャンル/トーン (任意)</label>
      <input type="text" id="genre" placeholder="例: VTuber切り抜き, テンション高め, コミカル">
    </div>
    <div class="field">
      <label>すでに使っているBGM/SEの傾向 (任意)</label>
      <input type="text" id="reference" placeholder="例: いつも和風コミカルなSEを使っている">
    </div>
    <button class="gen-btn" id="genBtn">テロップ/SE/BGMを提案する</button>
    <div class="hint">セリフの間や間合いに合わせて、テロップの見せ方・効果音のタイミング・BGMの方向性をまとめて提案します。</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="empty">左に切り抜き動画の文字起こしを入力して<br>「テロップ/SE/BGMを提案する」を押してください</div>
  </div>
</div>

<script src="shared/nav.js"></script>
<script src="shared/api-client.js"></script>
<script>
const genBtn = document.getElementById('genBtn');
const resultArea = document.getElementById('resultArea');
const transcriptText = document.getElementById('transcriptText');

function parseTimeToSeconds(str){
  const parts = str.trim().split(':');
  if(parts.length === 3){
    const [h,m,sRaw] = parts;
    return (+h)*3600 + (+m)*60 + parseFloat(sRaw.replace(',', '.'));
  } else if(parts.length === 2){
    const [m,sRaw] = parts;
    return (+m)*60 + parseFloat(sRaw.replace(',', '.'));
  }
  return parseFloat(str) || 0;
}

function parseTranscript(raw){
  const lines = raw.split('\n');
  const cues = [];
  const timeLineRe = /(\d{1,2}:\d{2}(?::\d{2})?[.,]?\d{0,3})\s*-->\s*(\d{1,2}:\d{2}(?::\d{2})?[.,]?\d{0,3})/;
  const bracketRe = /^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.*)$/;
  let i = 0;
  while(i < lines.length){
    const line = lines[i].trim();
    const tm = line.match(timeLineRe);
    if(tm){
      const start = parseTimeToSeconds(tm[1]);
      const end = parseTimeToSeconds(tm[2]);
      let buf = [];
      i++;
      while(i < lines.length && lines[i].trim() !== '' && !timeLineRe.test(lines[i])){ buf.push(lines[i].trim()); i++; }
      cues.push({ start, end, text: buf.join(' ') });
      continue;
    }
    const bm = line.match(bracketRe);
    if(bm){
      const start = parseTimeToSeconds(bm[1]);
      cues.push({ start, end: start + 3, text: bm[2] });
    }
    i++;
  }
  return cues;
}

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}

genBtn.addEventListener('click', async () => {
  const raw = transcriptText.value.trim();
  if(!raw){
    resultArea.innerHTML = '<div class="empty err">文字起こしテキストが必要です。</div>';
    return;
  }
  const genre = document.getElementById('genre').value.trim();
  const reference = document.getElementById('reference').value.trim();
  const cues = parseTranscript(raw);
  if(cues.length === 0){
    resultArea.innerHTML = '<div class="empty err">タイムスタンプを認識できませんでした。SRT/VTT形式か「[mm:ss] テキスト」形式で入力してください。</div>';
    return;
  }
  const totalDuration = Math.max(...cues.map(c => c.end || c.start));

  genBtn.disabled = true;
  resultArea.innerHTML = '<div class="loading">解析中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  const transcriptForPrompt = cues.map(c => `[${fmtTime(c.start)}] ${c.text}`).join('\n');

  const prompt = `あなたはショート動画/切り抜き動画のテロップ・効果音・BGM選定を専門とする編集プランナーです。
以下のタイムスタンプ付き文字起こしをもとに、この切り抜き動画のテロップ・効果音(SE)・BGMの提案を作成してください。

ジャンル/トーン: ${genre || '(指定なし)'}
すでに使っているBGM/SEの傾向: ${reference || '(指定なし)'}
動画の長さ目安: ${fmtTime(totalDuration)}

文字起こし:
${transcriptForPrompt}

必ず以下のJSON形式のみで出力してください。前置き、説明、コードブロック記号は一切付けないでください。

{
  "telops": [
    { "time": "0:03", "text": "テロップに表示する短い文言", "style": "emphasis", "note": "見せ方や色・アニメーションの補足(1文)" }
  ],
  "sfx": [
    { "time": "0:07", "cue": "ドンッ / きらーん のような擬音や効果音の種類", "note": "なぜこのタイミングに入れるか(1文)" }
  ],
  "bgm": {
    "genre": "BGMのジャンル",
    "mood": "雰囲気(例: コミカル, 緊張感, 高揚感)",
    "tempo": "テンポ感(例: アップテンポ/ミドル/スロー)",
    "notes": "BGMの入れ方・転換ポイントについての補足",
    "sections": [
      { "range": "0:00-0:10", "description": "この区間のBGM/展開の説明" }
    ]
  }
}

styleは "emphasis"(強調・大きめ), "normal"(通常テロップ), "tsukkomi"(ツッコミ/一言コメント風) のいずれか。
telopsは文字起こしの主要な箇所ごとに、sfxは驚き・オチ・間合いなど効果音が映える箇所に絞って提案してください。`;

  try{
    let text = await AnthropicAPI.createMessage({
      model: "claude-sonnet-5",
      max_tokens: 2000,
      messages: [{ role: "user", content: prompt }]
    });
    text = text.replace(/```json|```/g, "").trim();
    const result = JSON.parse(text);
    renderResult(result, totalDuration);
  }catch(err){
    resultArea.innerHTML = `<div class="empty err">生成に失敗しました: ${escapeHtml(err.message)}</div>`;
  }finally{
    genBtn.disabled = false;
  }
});

function pctOf(timeStr, total){
  const s = parseTimeToSeconds(timeStr);
  if(!total) return 0;
  return Math.min(100, Math.max(0, (s / total) * 100));
}

function renderResult(result, totalDuration){
  const telops = result.telops || [];
  const sfx = result.sfx || [];
  const bgm = result.bgm || {};

  let html = '<div class="section-label">// Timeline</div><div class="tracks-wrap">';

  html += '<div class="ruler">';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    html += `<span style="left:${f*100}%">${fmtTime(totalDuration * f)}</span>`;
  });
  html += '</div>';

  html += '<div class="track"><span class="track-label">TELOP</span>';
  telops.forEach(t => { html += `<div class="marker telop" style="left:${pctOf(t.time, totalDuration)}%" title="${escapeHtml(t.time)} ${escapeHtml(t.text||'')}"></div>`; });
  html += '</div>';

  html += '<div class="track"><span class="track-label">SE</span>';
  sfx.forEach(s => { html += `<div class="marker sfx" style="left:${pctOf(s.time, totalDuration)}%" title="${escapeHtml(s.time)} ${escapeHtml(s.cue||'')}"></div>`; });
  html += '</div>';

  html += '</div>';

  html += '<div class="section-label">// Telops</div><div class="list-block">';
  telops.forEach(t => {
    const styleClass = ['emphasis','normal','tsukkomi'].includes(t.style) ? t.style : 'normal';
    const styleJp = { emphasis:'強調', normal:'通常', tsukkomi:'ツッコミ' }[styleClass];
    html += `<div class="row">
      <div class="row-time">${escapeHtml(t.time||'')}</div>
      <div>
        <p class="row-text">${escapeHtml(t.text||'')}<span class="style-tag ${styleClass}">${styleJp}</span></p>
        <p class="row-note">${escapeHtml(t.note||'')}</p>
      </div>
    </div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// SE (効果音)</div><div class="list-block">';
  sfx.forEach(s => {
    html += `<div class="row">
      <div class="row-time">${escapeHtml(s.time||'')}</div>
      <div>
        <p class="row-text">${escapeHtml(s.cue||'')}</p>
        <p class="row-note">${escapeHtml(s.note||'')}</p>
      </div>
    </div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// BGM</div>';
  html += `<div class="bgm-card">
    <div class="bgm-head">
      <span class="bgm-chip">${escapeHtml(bgm.genre||'-')}</span>
      <span class="bgm-chip">${escapeHtml(bgm.mood||'-')}</span>
      <span class="bgm-chip">${escapeHtml(bgm.tempo||'-')}</span>
    </div>
    <p>${escapeHtml(bgm.notes||'')}</p>
    ${(bgm.sections||[]).map(s => `<p class="bgm-section">[${escapeHtml(s.range||'')}] ${escapeHtml(s.description||'')}</p>`).join('')}
  </div>`;

  resultArea.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

</body>
</html>
