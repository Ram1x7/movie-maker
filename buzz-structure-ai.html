<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バズる構成AI - Buzz Structure Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .wrap{ grid-template-columns: 340px 1fr; }
  @media (max-width: 860px){ .wrap{ grid-template-columns: 1fr; } }
  input[type=text], textarea, select{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); padding:10px 12px; border-radius:6px;
    font-family:'Noto Sans JP', sans-serif; font-size:13.5px;
    resize:vertical;
  }
  textarea{min-height:70px; line-height:1.5;}
  .gen-btn{ transition:transform .1s, opacity .2s; }
  .gen-btn:hover{ opacity:.9; }
  .gen-btn:active{ transform:scale(.98); }

  .section-label{ margin:0 0 10px; }
  .titles{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .title-chip{
    background:var(--cyan-dim); border:1px solid #4ecdc455; color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:13px;
  }
  .timeline{ margin-bottom:28px; }
  .clip{
    display:grid; grid-template-columns:64px 1fr; gap:14px;
    border-left:2px solid var(--line); padding:0 0 22px 18px; position:relative;
  }
  .clip:last-child{ padding-bottom:0; }
  .clip::before{
    content:''; position:absolute; left:-5px; top:2px;
    width:8px; height:8px; border-radius:50%; background:var(--accent);
  }
  .clip.hook::before{ background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .clip-time{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sub); padding-top:2px;
  }
  .clip-title{ font-weight:700; font-size:14.5px; margin:0 0 4px; }
  .clip-desc{ font-size:13px; color:#c7c5c1; line-height:1.65; margin:0; }
  .clip-tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .clip-tags span{
    font-size:10.5px; color:var(--accent); background:var(--accent-dim);
    padding:3px 8px; border-radius:4px; font-family:'JetBrains Mono', monospace;
  }
  .tips-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .tips-grid{ grid-template-columns:1fr; } }
  .tip-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px;
  }
  .tip-card h3{ margin:0 0 8px; font-size:12.5px; color:var(--cyan); font-family:'Space Grotesk',sans-serif;}
  .tip-card p{ margin:0; font-size:13px; color:#c7c5c1; line-height:1.7; }

  .mode-tabs{ display:flex; gap:6px; margin-bottom:22px; background:var(--panel2); border-radius:8px; padding:4px; }
  .mode-tab{
    flex:1; text-align:center; padding:9px 6px; border-radius:6px; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; color:var(--sub);
    transition:background .15s, color .15s;
  }
  .mode-tab.active{ background:var(--accent); color:#14161a; }

  .oembed-card{
    display:none; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px; margin-bottom:18px; align-items:center;
  }
  .oembed-card img{ width:64px; height:64px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .oembed-card .info{ min-width:0; }
  .oembed-card .info .t{ font-size:12.5px; font-weight:700; line-height:1.4; margin:0 0 3px; }
  .oembed-card .info .a{ font-size:11px; color:var(--sub); margin:0; }

  .analysis-block{ margin-bottom:22px; }
  .analysis-block h3{ font-size:13px; color:var(--cyan); font-family:'Space Grotesk', sans-serif; margin:0 0 8px; }
  .analysis-block p{ font-size:13.5px; color:#c7c5c1; line-height:1.75; margin:0; }
  .factor-list{ display:flex; flex-direction:column; gap:10px; }
  .factor-item{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .factor-item .f-label{ font-size:12px; font-weight:700; color:var(--accent); margin:0 0 4px; }
  .factor-item p{ font-size:13px; color:#c7c5c1; line-height:1.65; margin:0; }

  .video-entry-card{ border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; background:var(--panel); }
  .video-entry-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .video-entry-num{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12.5px; color:var(--accent); }
  .video-entry-remove{ background:none; border:1px solid var(--line); color:var(--sub); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:12px; line-height:1; flex-shrink:0; }
  .video-entry-remove:hover{ color:var(--text); background:var(--panel2); }
  .video-entry-remove:disabled{ opacity:.35; cursor:not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="rec"></div>
  <h1>Buzz Structure AI</h1>
  <div class="tag">v1 / 切り抜き・企画向け構成生成</div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="mode-tabs">
      <div class="mode-tab active" id="tabPlan">企画モード</div>
      <div class="mode-tab" id="tabResearch">リサーチモード</div>
    </div>

    <div id="planPanel">
      <div class="field">
        <label>ジャンル / カテゴリ</label>
        <input type="text" id="genre" placeholder="例: VTuber切り抜き, Heartopia攻略, 荒野行動">
      </div>
      <div class="field">
        <label>題材・ネタの概要</label>
        <textarea id="topic" placeholder="どんな素材/内容を扱うか。できるだけ具体的に。"></textarea>
      </div>
      <div class="field">
        <label>想定尺</label>
        <select id="duration">
          <option value="15秒前後(ショート)">15秒前後(ショート)</option>
          <option value="30〜60秒(ショート)" selected>30〜60秒(ショート)</option>
          <option value="1〜3分">1〜3分</option>
          <option value="3分以上">3分以上</option>
        </select>
      </div>
      <div class="field">
        <label>ターゲット層 (任意)</label>
        <input type="text" id="audience" placeholder="例: 10-20代のVTuberファン">
      </div>
      <div class="field">
        <label>参考にしたい要素 (任意)</label>
        <textarea id="reference" placeholder="意識したい過去バズ動画の特徴、テンションなど"></textarea>
      </div>
      <button class="gen-btn" id="genBtn">構成案を生成する</button>
      <div class="hint">入力内容をもとに、フック・構成・タイトル案・投稿のコツをAIが提案します。</div>
    </div>

    <div id="researchPanel" style="display:none;">
      <div id="researchEntries"></div>
      <button type="button" class="sub-btn" id="addEntryBtn" style="width:100%; margin-bottom:18px;">+ 動画を追加(最大5本)</button>
      <button class="gen-btn" id="researchBtn">まとめて分析する(構成の型を抽出)</button>
      <div class="hint">各動画を個別に分析したうえで、それらに共通する構成の型を抽出し、応用できる新しい構成案を提案します(3〜5本推奨)。</div>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="empty">左のフォームに題材を入力して<br>「構成案を生成する」を押してください</div>
  </div>
</div>

<video id="hiddenVideo" muted playsinline></video>
<canvas id="hiddenCanvas"></canvas>

<script src="shared/nav.js"></script>
<script src="shared/api-client.js"></script>
<script src="shared/history.js"></script>
<script src="shared/whisper.js"></script>
<script>
const genBtn = document.getElementById('genBtn');
const resultArea = document.getElementById('resultArea');

// ---- Mode tabs ----
const tabPlan = document.getElementById('tabPlan');
const tabResearch = document.getElementById('tabResearch');
const planPanel = document.getElementById('planPanel');
const researchPanel = document.getElementById('researchPanel');

tabPlan.addEventListener('click', () => {
  tabPlan.classList.add('active'); tabResearch.classList.remove('active');
  planPanel.style.display = ''; researchPanel.style.display = 'none';
  resultArea.innerHTML = '<div class="empty">左のフォームに題材を入力して<br>「構成案を生成する」を押してください</div>';
});
tabResearch.addEventListener('click', () => {
  tabResearch.classList.add('active'); tabPlan.classList.remove('active');
  researchPanel.style.display = ''; planPanel.style.display = 'none';
  resultArea.innerHTML = '<div class="empty">各動画のURLを入力し情報を取得後、<br>「まとめて分析する」を押してください</div>';
});

// ---- Research mode: multiple video entries (3〜5本) ----
const researchBtn = document.getElementById('researchBtn');

function detectPlatform(url){
  if(/tiktok\.com/i.test(url)) return 'tiktok';
  if(/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
  return null;
}

function entryTemplateHtml(n){
  return `
    <div class="video-entry-card">
      <div class="video-entry-head">
        <span class="video-entry-num">動画 #${n}</span>
        <button type="button" class="video-entry-remove re-remove-btn" title="この動画を削除">✕</button>
      </div>
      <div class="field">
        <label>動画URL (TikTok / YouTube)</label>
        <input type="text" class="re-url" placeholder="https://www.tiktok.com/@.../video/... または https://youtube.com/shorts/...">
      </div>
      <button type="button" class="sub-btn re-fetch-oembed-btn" style="margin-bottom:8px;">動画情報を取得</button>
      <div class="hint re-oembed-hint" style="margin-bottom:8px;">タイトル・投稿者・サムネイルをoEmbedで自動取得します(キー不要)。取得できない場合は下の「手動で入力する」から進められます。</div>
      <div class="hint re-oembed-fallback-toggle" style="margin-bottom:18px; cursor:pointer; text-decoration:underline;">手動で入力する</div>

      <div class="oembed-card re-oembed-card">
        <img class="re-oembed-thumb" src="" alt="">
        <div class="info">
          <p class="t re-oembed-title"></p>
          <p class="a re-oembed-author"></p>
        </div>
      </div>

      <div class="re-oembed-manual" style="display:none; margin-bottom:18px;">
        <div class="field">
          <label>タイトル(手動)</label>
          <input type="text" class="re-manual-title" placeholder="動画のタイトル">
        </div>
        <div class="field">
          <label>投稿者(手動)</label>
          <input type="text" class="re-manual-author" placeholder="投稿者名">
        </div>
        <button type="button" class="sub-btn re-use-manual-btn">この情報を使う</button>
      </div>

      <div class="field">
        <label>動画ファイル (任意・自動文字起こし用)</label>
        <div class="file-drop re-video-drop">
          クリックして動画を選択(保存済みのもの)
          <input type="file" class="re-video-input" accept="video/*">
          <div class="file-name re-video-name"></div>
        </div>
      </div>
      <div class="asr-box">
        <label>文字起こしモデル</label>
        <select class="re-asr-model">
          <option value="Xenova/whisper-tiny">軽量 (速いが精度低め)</option>
          <option value="Xenova/whisper-base" selected>標準 (バランス型)</option>
          <option value="Xenova/whisper-small">高精度 (重い・長い動画ではブラウザがクラッシュすることがあります)</option>
        </select>
        <div style="height:8px;"></div>
        <button type="button" class="sub-btn re-transcribe-btn">動画から文字起こしを生成</button>
        <div class="asr-progress re-asr-progress">処理はすべて端末内で行われ、動画はどこにも送信されません。</div>
      </div>

      <div class="field">
        <label>文字起こし / 内容メモ (任意・手入力も可)</label>
        <textarea class="re-transcript" placeholder="セリフや展開のメモ。文字起こし機能を使うと自動で入ります。" style="min-height:80px; font-family:'JetBrains Mono', monospace; font-size:12px;"></textarea>
      </div>
      <div class="field">
        <label>再生数・いいね数など (任意)</label>
        <input type="text" class="re-stats" placeholder="例: 再生数120万, いいね8万">
      </div>
    </div>
  `;
}

const researchEntriesContainer = document.getElementById('researchEntries');
const addEntryBtn = document.getElementById('addEntryBtn');
const MAX_ENTRIES = 5;
const MIN_ENTRIES = 1;
let entryCounter = 0;
const entries = [];

function updateAddRemoveState(){
  addEntryBtn.disabled = entries.length >= MAX_ENTRIES;
  addEntryBtn.style.opacity = entries.length >= MAX_ENTRIES ? '.5' : '';
  entries.forEach(en => { en.removeBtn.disabled = entries.length <= MIN_ENTRIES; });
}

function createEntry(){
  entryCounter++;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = entryTemplateHtml(entryCounter);
  const el = wrapper.firstElementChild;
  researchEntriesContainer.appendChild(el);

  const urlInput = el.querySelector('.re-url');
  const fetchBtn = el.querySelector('.re-fetch-oembed-btn');
  const oembedHintEl = el.querySelector('.re-oembed-hint');
  const OEMBED_DEFAULT_HINT_LOCAL = oembedHintEl.innerHTML;
  const fallbackToggle = el.querySelector('.re-oembed-fallback-toggle');
  const oembedCardEl = el.querySelector('.re-oembed-card');
  const oembedThumbEl = el.querySelector('.re-oembed-thumb');
  const oembedTitleEl = el.querySelector('.re-oembed-title');
  const oembedAuthorEl = el.querySelector('.re-oembed-author');
  const oembedManualEl = el.querySelector('.re-oembed-manual');
  const manualTitleEl = el.querySelector('.re-manual-title');
  const manualAuthorEl = el.querySelector('.re-manual-author');
  const useManualBtn = el.querySelector('.re-use-manual-btn');
  const videoDropEl = el.querySelector('.re-video-drop');
  const videoInputEl = el.querySelector('.re-video-input');
  const videoNameEl = el.querySelector('.re-video-name');
  const asrModelEl = el.querySelector('.re-asr-model');
  const transcribeBtnEl = el.querySelector('.re-transcribe-btn');
  const asrProgressEl = el.querySelector('.re-asr-progress');
  const ASR_DEFAULT_HINT_LOCAL = asrProgressEl.textContent;
  const transcriptEl = el.querySelector('.re-transcript');
  const statsEl = el.querySelector('.re-stats');
  const removeBtn = el.querySelector('.re-remove-btn');

  let fetchedOembed = null;
  let videoFile = null;

  if (WhisperUtil.isIOS()) {
    const smallOption = asrModelEl.querySelector('option[value="Xenova/whisper-small"]');
    if (smallOption) {
      smallOption.disabled = true;
      smallOption.textContent = '高精度 (iOSでは利用不可・メモリ不足でクラッシュします)';
    }
  }

  fallbackToggle.addEventListener('click', () => {
    oembedManualEl.style.display = oembedManualEl.style.display === 'none' ? '' : 'none';
  });

  useManualBtn.addEventListener('click', () => {
    const title = manualTitleEl.value.trim();
    const author = manualAuthorEl.value.trim();
    if(!title && !author){ alert('タイトルまたは投稿者を入力してください'); return; }
    fetchedOembed = { title, author, thumbnail: '' };
    oembedThumbEl.src = '';
    oembedThumbEl.style.display = 'none';
    oembedTitleEl.textContent = title;
    oembedAuthorEl.textContent = author;
    oembedCardEl.style.display = 'flex';
  });

  fetchBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if(!url){ alert('動画URLを入力してください'); return; }
    const platform = detectPlatform(url);
    if(!platform){ alert('TikTokまたはYouTubeのURLを入力してください'); return; }

    fetchBtn.disabled = true;
    fetchBtn.textContent = '取得中...';
    try{
      const endpoint = platform === 'tiktok'
        ? `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`
        : `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
      const res = await fetch(endpoint);
      if(!res.ok) throw new Error('oEmbed取得に失敗しました(プライベート動画・削除済み・CORS制限の可能性)');
      const data = await res.json();
      oembedHintEl.innerHTML = OEMBED_DEFAULT_HINT_LOCAL;
      oembedThumbEl.style.display = '';
      fetchedOembed = { title: data.title || '', author: data.author_name || '', thumbnail: data.thumbnail_url || '' };
      oembedThumbEl.src = fetchedOembed.thumbnail;
      oembedTitleEl.textContent = fetchedOembed.title;
      oembedAuthorEl.textContent = fetchedOembed.author;
      oembedCardEl.style.display = 'flex';
    }catch(err){
      oembedHintEl.innerHTML = `<span style="color:#ff6b6b;">動画情報の自動取得に失敗しました(${escapeHtml(err.message)})。TikTokはブラウザからの直接アクセスがブロックされる場合があります。</span>`;
      oembedManualEl.style.display = '';
    }finally{
      fetchBtn.disabled = false;
      fetchBtn.textContent = '動画情報を取得';
    }
  });

  videoDropEl.addEventListener('click', () => videoInputEl.click());

  videoInputEl.addEventListener('change', async () => {
    videoFile = videoInputEl.files[0];
    videoNameEl.textContent = videoFile ? videoFile.name : '';
    asrProgressEl.textContent = ASR_DEFAULT_HINT_LOCAL;
    videoDropEl.querySelectorAll('.size-warn').forEach(elx => elx.remove());
    if(videoFile){
      const warnings = await WhisperUtil.checkVideoSafety(videoFile);
      if(warnings.length > 0){
        const div = document.createElement('div');
        div.className = 'size-warn';
        div.innerHTML = '⚠ ' + warnings.map(escapeHtml).join('<br>⚠ ');
        videoNameEl.after(div);
      }
    }
  });

  transcribeBtnEl.addEventListener('click', async () => {
    if(!videoFile){ asrProgressEl.textContent = '先に「動画ファイル」を選択してください。'; return; }
    const modelName = asrModelEl.value;

    const platformBlock = WhisperUtil.getPlatformModelBlock(modelName);
    if(platformBlock){ alert(platformBlock); return; }

    const switchWarning = WhisperUtil.checkModelSwitchRisk(modelName);
    if(switchWarning && !confirm(switchWarning)) return;

    try{
      const duration = await WhisperUtil.getVideoDuration(videoFile);
      const durationWarning = WhisperUtil.getModelDurationWarning(modelName, duration);
      if(durationWarning && !confirm(durationWarning)) return;
    }catch(e){ /* メタデータ取得失敗時は警告をスキップ */ }

    transcribeBtnEl.disabled = true;
    researchBtn.disabled = true;
    try{
      const { lines, rawText, decodedSeconds } = await WhisperUtil.transcribeVideo(videoFile, {
        modelName,
        onStatus: (s) => { asrProgressEl.textContent = s; },
      });
      const formatted = lines.map(l => `[${WhisperUtil.fmtTime(l.time)}] ${l.text}`);
      transcriptEl.value = formatted.length ? formatted.join('\n') : rawText;
      asrProgressEl.textContent = `完了: ${formatted.length || 1}セグメントを生成しました。(認識した音声の長さ: 約${Math.round(decodedSeconds)}秒。動画の長さと大きく異なる場合はお知らせください)`;
    }catch(err){
      asrProgressEl.textContent = `文字起こしに失敗しました: ${err.message}`;
    }finally{
      transcribeBtnEl.disabled = false;
      researchBtn.disabled = false;
    }
  });

  removeBtn.addEventListener('click', () => {
    if(entries.length <= MIN_ENTRIES) return;
    const idx = entries.indexOf(entryObj);
    if(idx !== -1) entries.splice(idx, 1);
    el.remove();
    updateAddRemoveState();
  });

  const entryObj = {
    el, removeBtn,
    getData(){
      const url = urlInput.value.trim();
      const stats = statsEl.value.trim();
      const transcript = transcriptEl.value.trim();
      return {
        url,
        title: fetchedOembed ? fetchedOembed.title : '',
        author: fetchedOembed ? fetchedOembed.author : '',
        stats,
        transcript,
        hasContent: !!(fetchedOembed || transcript),
      };
    },
  };
  entries.push(entryObj);
  updateAddRemoveState();
  return entryObj;
}

addEntryBtn.addEventListener('click', () => {
  if(entries.length >= MAX_ENTRIES) return;
  createEntry();
});

for(let i = 0; i < 3; i++) createEntry();

// ---- Research analysis: per-video, then cross-video synthesis ----
const RESEARCH_SCHEMA = {
  type: "object",
  properties: {
    summary: { type: "string" },
    factors: {
      type: "array",
      items: {
        type: "object",
        properties: { label: { type: "string" }, body: { type: "string" } },
        required: ["label", "body"],
        additionalProperties: false
      }
    },
    title_pattern: { type: "string" },
    takeaways: { type: "string" }
  },
  required: ["summary", "factors", "title_pattern", "takeaways"],
  additionalProperties: false
};

async function analyzeOneVideo({ url, title, author, stats, transcript }){
  const prompt = `あなたはショート動画のバズ分析を専門とする編集プランナーです。以下の情報から、この動画がバズっている(あるいはバズりやすい)要因を分析し、自分の企画・切り抜き制作に応用できる形でまとめてください。

動画URL: ${url || '(不明)'}
タイトル: ${title || '(不明)'}
投稿者: ${author || '(不明)'}
統計情報: ${stats || '(不明)'}
文字起こし/内容メモ:
${transcript || '(なし・タイトルと投稿者情報のみで分析)'}

必ず以下のJSON形式のみで出力してください。前置き、説明、コードブロック記号は一切付けないでください。

{
  "summary": "この動画の要点と、バズっている(バズりやすい)背景の総括(2-3文)",
  "factors": [
    { "label": "要因の見出し(例: 冒頭3秒のフック)", "body": "具体的な説明" }
  ],
  "title_pattern": "タイトルや構成の型についての分析",
  "takeaways": "自分の企画・切り抜き制作にどう応用できるかの具体的な提案"
}

factorsは3〜5個程度。情報が少ない場合は、わかる範囲で一般的な傾向も交えつつ、憶測であることが分かるように書いてください。`;

  const text = await AnthropicAPI.createMessage({
    model: "claude-sonnet-5",
    max_tokens: 3000,
    messages: [{ role: "user", content: prompt }],
    output_config: { format: { type: "json_schema", schema: RESEARCH_SCHEMA } }
  });
  return AnthropicAPI.parseJson(text);
}

const SYNTHESIS_SCHEMA = {
  type: "object",
  properties: {
    common_summary: { type: "string" },
    common_factors: {
      type: "array",
      items: {
        type: "object",
        properties: { label: { type: "string" }, body: { type: "string" } },
        required: ["label", "body"],
        additionalProperties: false
      }
    },
    titles: { type: "array", items: { type: "string" } },
    clips: {
      type: "array",
      items: {
        type: "object",
        properties: {
          time: { type: "string" },
          label: { type: "string" },
          isHook: { type: "boolean" },
          description: { type: "string" },
          tags: { type: "array", items: { type: "string" } }
        },
        required: ["time", "label", "isHook", "description", "tags"],
        additionalProperties: false
      }
    },
    tips: {
      type: "array",
      items: {
        type: "object",
        properties: { title: { type: "string" }, body: { type: "string" } },
        required: ["title", "body"],
        additionalProperties: false
      }
    }
  },
  required: ["common_summary", "common_factors", "titles", "clips", "tips"],
  additionalProperties: false
};

async function synthesizeCommonPattern(perVideoResults){
  const videosBlock = perVideoResults.map((v, i) => `
--- 動画${i + 1} ---
URL: ${v.url || '(不明)'}
タイトル: ${v.title || '(不明)'}
投稿者: ${v.author || '(不明)'}
統計情報: ${v.stats || '(不明)'}
[個別分析結果]
要約: ${v.analysis.summary}
要因: ${v.analysis.factors.map(f => `${f.label}: ${f.body}`).join(' / ')}
タイトル/構成の型: ${v.analysis.title_pattern}
応用ポイント: ${v.analysis.takeaways}
`).join('\n');

  const prompt = `あなたはショート動画のバズ分析を専門とする編集プランナーです。以下は、${perVideoResults.length}本のバズった(バズりやすい)動画をそれぞれ個別に分析した結果です。
${videosBlock}

これらの動画に共通する構成の型・パターンを抽出し、それを踏まえた新しい動画の構成案を1つ提案してください。

必ず以下のJSON形式のみで出力してください。前置きや説明、コードブロックの記号は一切付けないでください。

{
  "common_summary": "${perVideoResults.length}本を通じて共通する構成の型・パターンの総括(2-4文)",
  "common_factors": [
    { "label": "共通する要因の見出し", "body": "具体的な説明(複数の動画に共通して見られる根拠を含める)" }
  ],
  "titles": ["タイトル案1", "タイトル案2", "タイトル案3", "タイトル案4"],
  "clips": [
    {
      "time": "0:00-0:03",
      "label": "フック",
      "isHook": true,
      "description": "冒頭で視聴者を止めるための具体的なセリフ/展開案",
      "tags": ["テロップ案", "効果音案"]
    }
  ],
  "tips": [
    { "title": "サムネのポイント", "body": "具体的な提案" },
    { "title": "投稿のコツ", "body": "具体的な提案" }
  ]
}

common_factorsは3〜5個程度。titles/clips/tipsは「バズる構成AI」の企画モードと同じ形式で、上記の共通パターンを踏まえた新しい構成案として作成してください(想定尺は特に指定が無ければ30〜60秒のショート動画を想定)。clipsは4〜7個程度、時系列順に。`;

  const text = await AnthropicAPI.createMessage({
    model: "claude-sonnet-5",
    max_tokens: 5000,
    messages: [{ role: "user", content: prompt }],
    output_config: { format: { type: "json_schema", schema: SYNTHESIS_SCHEMA } }
  });
  return AnthropicAPI.parseJson(text);
}

researchBtn.addEventListener('click', async () => {
  const validEntries = entries.map(e => e.getData()).filter(d => d.hasContent);
  if(validEntries.length === 0){
    resultArea.innerHTML = '<div class="empty err">少なくとも1本は、動画情報の取得または文字起こし/内容メモの入力が必要です。</div>';
    return;
  }

  researchBtn.disabled = true;
  try{
    const perVideoResults = [];
    for(let i = 0; i < validEntries.length; i++){
      resultArea.innerHTML = `<div class="loading">${i + 1}/${validEntries.length}本目を分析中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      const analysis = await analyzeOneVideo(validEntries[i]);
      perVideoResults.push({ ...validEntries[i], analysis });
    }

    resultArea.innerHTML = '<div class="loading">共通する構成の型を抽出中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    const result = await synthesizeCommonPattern(perVideoResults);
    lastPlanResult = result;
    renderMultiResearchResult(result, perVideoResults);
    HistoryStore.save('buzz-structure', { label: `複数動画リサーチ(${validEntries.length}本・共通構成案)`, result });
  }catch(err){
    resultArea.innerHTML = `<div class="empty err">分析に失敗しました: ${escapeHtml(err.message)}</div>`;
  }finally{
    researchBtn.disabled = false;
  }
});

function commonPatternHtml(result){
  let html = '<div class="section-label">// Common Pattern</div>';
  html += `<div class="analysis-block" style="margin-bottom:22px;"><p>${escapeHtml(result.common_summary || '')}</p></div>`;
  html += '<div class="factor-list" style="margin-bottom:28px;">';
  (result.common_factors || []).forEach(f => {
    html += `<div class="factor-item"><p class="f-label">${escapeHtml(f.label || '')}</p><p>${escapeHtml(f.body || '')}</p></div>`;
  });
  html += '</div>';
  return html;
}

function renderMultiResearchResult(result, perVideoResults){
  let html = '<div class="section-label">// Analyzed Videos</div>';
  html += '<div class="factor-list" style="margin-bottom:28px;">';
  perVideoResults.forEach((v, i) => {
    html += `<div class="factor-item"><p class="f-label">動画${i + 1}: ${escapeHtml(v.title || v.url || '(タイトル不明)')}</p><p>${escapeHtml(v.analysis.summary || '')}</p></div>`;
  });
  html += '</div>';
  html += commonPatternHtml(result);
  renderResult(result, html);
}

function renderPlanOrResearchResult(result){
  if(result && typeof result.common_summary === 'string'){
    renderResult(result, commonPatternHtml(result));
  } else {
    renderResult(result);
  }
}

  const topic = document.getElementById('topic').value.trim();
  const duration = document.getElementById('duration').value;
  const audience = document.getElementById('audience').value.trim();

  if(!topic){

  genBtn.disabled = true;
  resultArea.innerHTML = '<div class="loading">構成案を生成中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  const prompt = `あなたはショート動画・切り抜き動画のバズる構成を専門とする編集プランナーです。
以下の条件から、バズりやすい動画構成案を1つ作成してください。

ジャンル/カテゴリ: ${genre || '(指定なし)'}
題材・ネタの概要: ${topic}
想定尺: ${duration}
ターゲット層: ${audience || '(指定なし)'}
参考にしたい要素: ${reference || '(指定なし)'}

必ず以下のJSON形式のみで出力してください。前置きや説明、コードブロックの記号は一切付けないでください。

{
  "titles": ["タイトル案1", "タイトル案2", "タイトル案3", "タイトル案4"],
  "clips": [
    {
      "time": "0:00-0:03",
      "label": "フック",
      "isHook": true,
      "description": "冒頭で視聴者を止めるための具体的なセリフ/展開案",
      "tags": ["テロップ案", "効果音案"]
    }
  ],
  "tips": [
    { "title": "サムネのポイント", "body": "具体的な提案" },

  ]
}

clipsは想定尺に応じて4〜7個程度、時系列順に。各clipのtagsにはテロップ・効果音・BGMの方向性を短く含めてください。`;

  const PLAN_SCHEMA = {
    type: "object",
    properties: {
      titles: { type: "array", items: { type: "string" } },
      clips: {
        type: "array",
        items: {
          type: "object",
          properties: {
            time: { type: "string" },
            label: { type: "string" },
            isHook: { type: "boolean" },
            description: { type: "string" },
            tags: { type: "array", items: { type: "string" } }
          },
          required: ["time", "label", "isHook", "description", "tags"],
          additionalProperties: false
        }
      },
      tips: {
        type: "array",
        items: {
          type: "object",
          properties: { title: { type: "string" }, body: { type: "string" } },
          required: ["title", "body"],
          additionalProperties: false
        }
      }
    },
    required: ["titles", "clips", "tips"],

  try{
    const text = await AnthropicAPI.createMessage({
      model: "claude-sonnet-5",
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }],

let lastPlanResult = null;

HistoryUI.init({
  toolKey: 'buzz-structure',
  onRestore: (result) => {
    lastPlanResult = result;
    renderPlanOrResearchResult(result);
  },
});

resultArea.addEventListener('click', (e) => {
  if(e.target && e.target.id === 'copyPlanJsonBtn' && lastPlanResult){
    navigator.clipboard.writeText(JSON.stringify(lastPlanResult)).then(() => {
      e.target.textContent = 'コピーしました';
      setTimeout(() => { e.target.textContent = 'この結果をコピー(編集タイムライン統合AI用)'; }, 2000);
    }).catch(() => {
      e.target.textContent = 'コピーに失敗しました';
    });
  }
});

function renderResult(result, prefixHtml){
  let html = prefixHtml || '';

  html += '<button type="button" class="sub-btn" id="copyPlanJsonBtn" style="margin-bottom:20px;">この結果をコピー(編集タイムライン統合AI用)</button>';

  html += '<div class="section-label">// Title Ideas</div>';
  html += '<div class="titles">';
  (result.titles || []).forEach(t => {
    html += `<div class="title-chip">${escapeHtml(t)}</div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// Timeline</div>';
  html += '<div class="timeline">';
  (result.clips || []).forEach(c => {
    html += `<div class="clip ${c.isHook ? 'hook' : ''}">
      <div class="clip-time">${escapeHtml(c.time || '')}</div>
      <div>
        <p class="clip-title">${escapeHtml(c.label || '')}</p>
        <p class="clip-desc">${escapeHtml(c.description || '')}</p>
        <div class="clip-tags">${(c.tags||[]).map(tag=>`<span>${escapeHtml(tag)}</span>`).join('')}</div>
      </div>
    </div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// Tips</div>';
  html += '<div class="tips-grid">';
  (result.tips || []).forEach(t => {
    html += `<div class="tip-card"><h3>${escapeHtml(t.title||'')}</h3><p>${escapeHtml(t.body||'')}</p></div>`;
  });
  html += '</div>';

  resultArea.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
