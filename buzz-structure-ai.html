<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バズる構成AI - Buzz Structure Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1f26;
    --panel2: #22262f;
    --line: #2c313b;
    --text: #e9e7e2;
    --sub: #8b8d97;
    --accent: #ff6b35;
    --accent-dim: #ff6b3522;
    --cyan: #4ecdc4;
    --cyan-dim: #4ecdc422;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:18px 28px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #17191f 0%, #14161a 100%);
  }
  .topbar .rec{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .topbar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px; font-weight:700; letter-spacing:.04em; margin:0;
    text-transform:uppercase;
  }
  .topbar .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--sub); margin-left:auto;
  }
  .wrap{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:1px;
    background:var(--line);
    min-height:calc(100vh - 60px);
  }
  @media (max-width: 860px){ .wrap{ grid-template-columns: 1fr; } }
  .panel{ background:var(--bg); padding:24px; }
  .field{ margin-bottom:18px; }
  label{
    display:block; font-size:11px; color:var(--sub);
    font-family:'JetBrains Mono', monospace; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:6px;
  }
  input[type=text], textarea, select{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); padding:10px 12px; border-radius:6px;
    font-family:'Noto Sans JP', sans-serif; font-size:13.5px;
    resize:vertical;
  }
  input:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--accent);
  }
  textarea{min-height:70px; line-height:1.5;}
  .gen-btn{
    width:100%; padding:13px; border-radius:6px; border:none;
    background:var(--accent); color:#14161a; font-weight:700;
    font-size:14px; cursor:pointer; letter-spacing:.02em;
    font-family:'Space Grotesk', sans-serif;
    transition:transform .1s, opacity .2s;
  }
  .gen-btn:hover{ opacity:.9; }
  .gen-btn:active{ transform:scale(.98); }
  .gen-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .hint{ font-size:11px; color:var(--sub); margin-top:6px; line-height:1.5;}
  .result-area{ padding:28px 32px; overflow-x:auto; }
  .empty{
    color:var(--sub); font-size:13px; height:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:300px; text-align:center; line-height:1.8;
    font-family:'JetBrains Mono', monospace;
  }
  .loading{
    display:flex; gap:6px; align-items:center; color:var(--sub);
    font-family:'JetBrains Mono', monospace; font-size:12px;
    min-height:300px; justify-content:center;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  .section-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--cyan);
    text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px;
  }
  .titles{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .title-chip{
    background:var(--cyan-dim); border:1px solid #4ecdc455; color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:13px;
  }
  .timeline{ margin-bottom:28px; }
  .clip{
    display:grid; grid-template-columns:64px 1fr; gap:14px;
    border-left:2px solid var(--line); padding:0 0 22px 18px; position:relative;
  }
  .clip:last-child{ padding-bottom:0; }
  .clip::before{
    content:''; position:absolute; left:-5px; top:2px;
    width:8px; height:8px; border-radius:50%; background:var(--accent);
  }
  .clip.hook::before{ background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .clip-time{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sub); padding-top:2px;
  }
  .clip-title{ font-weight:700; font-size:14.5px; margin:0 0 4px; }
  .clip-desc{ font-size:13px; color:#c7c5c1; line-height:1.65; margin:0; }
  .clip-tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .clip-tags span{
    font-size:10.5px; color:var(--accent); background:var(--accent-dim);
    padding:3px 8px; border-radius:4px; font-family:'JetBrains Mono', monospace;
  }
  .tips-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .tips-grid{ grid-template-columns:1fr; } }
  .tip-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px;
  }
  .tip-card h3{ margin:0 0 8px; font-size:12.5px; color:var(--cyan); font-family:'Space Grotesk',sans-serif;}
  .tip-card p{ margin:0; font-size:13px; color:#c7c5c1; line-height:1.7; }
  .err{ color:#ff6b6b; font-size:12.5px; font-family:'JetBrains Mono', monospace; }

  .mode-tabs{ display:flex; gap:6px; margin-bottom:22px; background:var(--panel2); border-radius:8px; padding:4px; }
  .mode-tab{
    flex:1; text-align:center; padding:9px 6px; border-radius:6px; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; color:var(--sub);
    transition:background .15s, color .15s;
  }
  .mode-tab.active{ background:var(--accent); color:#14161a; }

  .file-drop{
    border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center;
    font-size:12px; color:var(--sub); cursor:pointer; transition:border-color .15s;
  }
  .file-drop:hover{ border-color:var(--accent); color:var(--text); }
  .file-drop input{ display:none; }
  .file-name{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--cyan); margin-top:6px; word-break:break-all; }
  .size-warn{ color:#ff6b6b; font-size:11px; margin-top:6px; line-height:1.6; }

  .sub-btn{
    width:100%; padding:10px; border-radius:6px; border:1px solid var(--cyan); background:transparent;
    color:var(--cyan); font-weight:600; font-size:12.5px; cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
  .sub-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .asr-box{ border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:18px; background:var(--panel); }
  .asr-progress{ font-size:11px; color:var(--gold, #f4c95d); font-family:'JetBrains Mono', monospace; margin-top:8px; min-height:14px; line-height:1.5; }

  .oembed-card{
    display:none; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px; margin-bottom:18px; align-items:center;
  }
  .oembed-card img{ width:64px; height:64px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .oembed-card .info{ min-width:0; }
  .oembed-card .info .t{ font-size:12.5px; font-weight:700; line-height:1.4; margin:0 0 3px; }
  .oembed-card .info .a{ font-size:11px; color:var(--sub); margin:0; }

  .analysis-block{ margin-bottom:22px; }
  .analysis-block h3{ font-size:13px; color:var(--cyan); font-family:'Space Grotesk', sans-serif; margin:0 0 8px; }
  .analysis-block p{ font-size:13.5px; color:#c7c5c1; line-height:1.75; margin:0; }
  .factor-list{ display:flex; flex-direction:column; gap:10px; }
  .factor-item{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .factor-item .f-label{ font-size:12px; font-weight:700; color:var(--accent); margin:0 0 4px; }
  .factor-item p{ font-size:13px; color:#c7c5c1; line-height:1.65; margin:0; }
  video, canvas{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="rec"></div>
  <h1>Buzz Structure AI</h1>
  <div class="tag">v1 / 切り抜き・企画向け構成生成</div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="mode-tabs">
      <div class="mode-tab active" id="tabPlan">企画モード</div>
      <div class="mode-tab" id="tabResearch">リサーチモード</div>
    </div>

    <div id="planPanel">
      <div class="field">
        <label>ジャンル / カテゴリ</label>
        <input type="text" id="genre" placeholder="例: VTuber切り抜き, Heartopia攻略, 荒野行動">
      </div>
      <div class="field">
        <label>題材・ネタの概要</label>
        <textarea id="topic" placeholder="どんな素材/内容を扱うか。できるだけ具体的に。"></textarea>
      </div>
      <div class="field">
        <label>想定尺</label>
        <select id="duration">
          <option value="15秒前後(ショート)">15秒前後(ショート)</option>
          <option value="30〜60秒(ショート)" selected>30〜60秒(ショート)</option>
          <option value="1〜3分">1〜3分</option>
          <option value="3分以上">3分以上</option>
        </select>
      </div>
      <div class="field">
        <label>ターゲット層 (任意)</label>
        <input type="text" id="audience" placeholder="例: 10-20代のVTuberファン">
      </div>
      <div class="field">
        <label>参考にしたい要素 (任意)</label>
        <textarea id="reference" placeholder="意識したい過去バズ動画の特徴、テンションなど"></textarea>
      </div>
      <button class="gen-btn" id="genBtn">構成案を生成する</button>
      <div class="hint">入力内容をもとに、フック・構成・タイトル案・投稿のコツをAIが提案します。</div>
    </div>

    <div id="researchPanel" style="display:none;">
      <div class="field">
        <label>動画URL (TikTok / YouTube)</label>
        <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/@.../video/... または https://youtube.com/shorts/...">
      </div>
      <button class="sub-btn" id="fetchOembedBtn" style="margin-bottom:8px;">動画情報を取得</button>
      <div class="hint" style="margin-bottom:18px;">タイトル・投稿者・サムネイルをoEmbedで自動取得します(キー不要)。</div>

      <div class="oembed-card" id="oembedCard">
        <img id="oembedThumb" src="" alt="">
        <div class="info">
          <p class="t" id="oembedTitle"></p>
          <p class="a" id="oembedAuthor"></p>
        </div>
      </div>

      <div class="field">
        <label>動画ファイル (任意・自動文字起こし用)</label>
        <div class="file-drop" id="videoDrop">
          クリックして動画を選択(保存済みのもの)
          <input type="file" id="videoInput" accept="video/*">
          <div class="file-name" id="videoName"></div>
        </div>
      </div>
      <div class="asr-box">
        <label>文字起こしモデル</label>
        <select id="asrModel">
          <option value="Xenova/whisper-tiny">軽量 (速いが精度低め)</option>
          <option value="Xenova/whisper-base" selected>標準 (バランス型)</option>
          <option value="Xenova/whisper-small">高精度 (重い・時間がかかる)</option>
        </select>
        <div style="height:8px;"></div>
        <button class="sub-btn" id="transcribeBtn">動画から文字起こしを生成</button>
        <div class="asr-progress" id="asrProgress">処理はすべて端末内で行われ、動画はどこにも送信されません。</div>
      </div>

      <div class="field">
        <label>文字起こし / 内容メモ (任意・手入力も可)</label>
        <textarea id="researchTranscript" placeholder="セリフや展開のメモ。文字起こし機能を使うと自動で入ります。" style="min-height:100px; font-family:'JetBrains Mono', monospace; font-size:12px;"></textarea>
      </div>
      <div class="field">
        <label>再生数・いいね数など (任意)</label>
        <input type="text" id="researchStats" placeholder="例: 再生数120万, いいね8万">
      </div>
      <button class="gen-btn" id="researchBtn">この動画を分析する</button>
      <div class="hint">タイトル・文字起こし・統計(あれば)から、バズった要因と自分の企画への応用ポイントをAIが分析します。</div>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="empty">左のフォームに題材を入力して<br>「構成案を生成する」を押してください</div>
  </div>
</div>

<video id="hiddenVideo" muted playsinline></video>
<canvas id="hiddenCanvas"></canvas>


<script>
const genBtn = document.getElementById('genBtn');
const resultArea = document.getElementById('resultArea');

// ---- Mode tabs ----
const tabPlan = document.getElementById('tabPlan');
const tabResearch = document.getElementById('tabResearch');
const planPanel = document.getElementById('planPanel');
const researchPanel = document.getElementById('researchPanel');

tabPlan.addEventListener('click', () => {
  tabPlan.classList.add('active'); tabResearch.classList.remove('active');
  planPanel.style.display = ''; researchPanel.style.display = 'none';
  resultArea.innerHTML = '<div class="empty">左のフォームに題材を入力して<br>「構成案を生成する」を押してください</div>';
});
tabResearch.addEventListener('click', () => {
  tabResearch.classList.add('active'); tabPlan.classList.remove('active');
  researchPanel.style.display = ''; planPanel.style.display = 'none';
  resultArea.innerHTML = '<div class="empty">動画URLを入力し情報を取得後、<br>「この動画を分析する」を押してください</div>';
});

// ---- oEmbed fetch ----
const videoUrlInput = document.getElementById('videoUrl');
const fetchOembedBtn = document.getElementById('fetchOembedBtn');
const oembedCard = document.getElementById('oembedCard');
const oembedThumb = document.getElementById('oembedThumb');
const oembedTitle = document.getElementById('oembedTitle');
const oembedAuthor = document.getElementById('oembedAuthor');
let fetchedOembed = null;

function detectPlatform(url){
  if(/tiktok\.com/i.test(url)) return 'tiktok';
  if(/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
  return null;
}

fetchOembedBtn.addEventListener('click', async () => {
  const url = videoUrlInput.value.trim();
  if(!url){ alert('動画URLを入力してください'); return; }
  const platform = detectPlatform(url);
  if(!platform){ alert('TikTokまたはYouTubeのURLを入力してください'); return; }

  fetchOembedBtn.disabled = true;
  fetchOembedBtn.textContent = '取得中...';
  try{
    const endpoint = platform === 'tiktok'
      ? `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`
      : `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    const res = await fetch(endpoint);
    if(!res.ok) throw new Error('oEmbed取得に失敗しました(プライベート動画・削除済み・CORS制限の可能性)');
    const data = await res.json();
    fetchedOembed = { title: data.title || '', author: data.author_name || '', thumbnail: data.thumbnail_url || '' };
    oembedThumb.src = fetchedOembed.thumbnail;
    oembedTitle.textContent = fetchedOembed.title;
    oembedAuthor.textContent = fetchedOembed.author;
    oembedCard.style.display = 'flex';
  }catch(err){
    alert('動画情報の取得に失敗しました: ' + err.message);
  }finally{
    fetchOembedBtn.disabled = false;
    fetchOembedBtn.textContent = '動画情報を取得';
  }
});

// ---- Whisper transcription (client-side, reused pattern) ----
const videoDrop = document.getElementById('videoDrop');
const videoInput = document.getElementById('videoInput');
const videoName = document.getElementById('videoName');
const transcribeBtn = document.getElementById('transcribeBtn');
const asrProgress = document.getElementById('asrProgress');
const asrModelSelect = document.getElementById('asrModel');
const researchTranscript = document.getElementById('researchTranscript');
const hiddenVideo = document.getElementById('hiddenVideo');
const ASR_DEFAULT_HINT = asrProgress.textContent;
const SIZE_WARN_BYTES = 500 * 1024 * 1024;
const DURATION_WARN_SEC = 20 * 60;

let videoFile = null;
let cachedTranscriber = null;
let cachedTranscriberModel = null;

videoDrop.addEventListener('click', () => videoInput.click());

videoInput.addEventListener('change', () => {
  videoFile = videoInput.files[0];
  videoName.textContent = videoFile ? videoFile.name : '';
  asrProgress.textContent = ASR_DEFAULT_HINT;
  document.querySelectorAll('#videoDrop .size-warn').forEach(el => el.remove());
  if(videoFile) checkVideoSafety(videoFile);
});

function getVideoDuration(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror = () => { URL.revokeObjectURL(url); reject(new Error('metadata read failed')); };
    v.src = url;
  });
}

async function checkVideoSafety(file){
  const warnings = [];
  if(file.size > SIZE_WARN_BYTES){
    warnings.push(`ファイルサイズが大きめです(${(file.size/1024/1024).toFixed(0)}MB)。処理が重くなる可能性があります。`);
  }
  try{
    const duration = await getVideoDuration(file);
    if(duration > DURATION_WARN_SEC){
      warnings.push(`動画が長め(約${Math.round(duration/60)}分)です。文字起こしに時間がかかる可能性があります。`);
    }
  }catch(e){ /* ignore */ }
  if(warnings.length > 0){
    const div = document.createElement('div');
    div.className = 'size-warn';
    div.innerHTML = '⚠ ' + warnings.join('<br>⚠ ');
    videoName.after(div);
  }
}

async function decodeAudioTo16kMono(file){
  const arrayBuffer = await file.arrayBuffer();
  const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await tmpCtx.decodeAudioData(arrayBuffer);
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = decoded;
  source.connect(offlineCtx.destination);
  source.start(0);
  const rendered = await offlineCtx.startRendering();
  tmpCtx.close();
  return rendered.getChannelData(0);
}

async function getTranscriber(modelName, onProgress){
  if(cachedTranscriber && cachedTranscriberModel === modelName) return cachedTranscriber;
  const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
  const transcriber = await pipeline('automatic-speech-recognition', modelName, { progress_callback: onProgress });
  cachedTranscriber = transcriber;
  cachedTranscriberModel = modelName;
  return transcriber;
}

function fmtTimeShort(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

transcribeBtn.addEventListener('click', async () => {
  if(!videoFile){ asrProgress.textContent = '先に「動画ファイル」を選択してください。'; return; }
  transcribeBtn.disabled = true;
  researchBtn.disabled = true;
  try{
    asrProgress.textContent = '音声データを準備中...';
    const audioData = await decodeAudioTo16kMono(videoFile);
    const modelName = asrModelSelect.value;
    asrProgress.textContent = 'モデルを読み込み中... (初回のみ時間がかかります)';
    const transcriber = await getTranscriber(modelName, (p) => {
      if(p.status === 'progress' && p.file){
        asrProgress.textContent = `モデル読み込み中: ${p.file} (${Math.round(p.progress||0)}%)`;
      }
    });
    asrProgress.textContent = '文字起こし中...';
    const output = await transcriber(audioData, {
      language: 'japanese', task: 'transcribe', chunk_length_s: 30, stride_length_s: 5, return_timestamps: true
    });
    const chunks = output.chunks || [];
    const lines = chunks.map(c => {
      const start = (c.timestamp && c.timestamp[0]) || 0;
      const txt = (c.text || '').trim();
      return txt ? `[${fmtTimeShort(start)}] ${txt}` : null;
    }).filter(Boolean);
    researchTranscript.value = lines.length ? lines.join('\n') : (output.text || '');
    asrProgress.textContent = `完了: ${lines.length || 1}セグメントを生成しました。`;
  }catch(err){
    asrProgress.textContent = `文字起こしに失敗しました: ${err.message}`;
  }finally{
    transcribeBtn.disabled = false;
    researchBtn.disabled = false;
  }
});

// ---- Research analysis ----
const researchBtn = document.getElementById('researchBtn');

researchBtn.addEventListener('click', async () => {
  const transcript = researchTranscript.value.trim();
  const stats = document.getElementById('researchStats').value.trim();
  const url = videoUrlInput.value.trim();

  if(!fetchedOembed && !transcript){
    resultArea.innerHTML = '<div class="empty err">動画情報を取得するか、文字起こし/内容メモを入力してください。</div>';
    return;
  }

  researchBtn.disabled = true;
  resultArea.innerHTML = '<div class="loading">分析中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  const prompt = `あなたはショート動画のバズ分析を専門とする編集プランナーです。以下の情報から、この動画がバズっている(あるいはバズりやすい)要因を分析し、自分の企画・切り抜き制作に応用できる形でまとめてください。

動画URL: ${url || '(不明)'}
タイトル: ${fetchedOembed ? fetchedOembed.title : '(不明)'}
投稿者: ${fetchedOembed ? fetchedOembed.author : '(不明)'}
統計情報: ${stats || '(不明)'}
文字起こし/内容メモ:
${transcript || '(なし・タイトルと投稿者情報のみで分析)'}

必ず以下のJSON形式のみで出力してください。前置き、説明、コードブロック記号は一切付けないでください。

{
  "summary": "この動画の要点と、バズっている(バズりやすい)背景の総括(2-3文)",
  "factors": [
    { "label": "要因の見出し(例: 冒頭3秒のフック)", "body": "具体的な説明" }
  ],
  "title_pattern": "タイトルや構成の型についての分析",
  "takeaways": "自分の企画・切り抜き制作にどう応用できるかの具体的な提案"
}

factorsは3〜5個程度。情報が少ない場合は、わかる範囲で一般的な傾向も交えつつ、憶測であることが分かるように書いてください。`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    let text = data.content.map(b => b.text || "").join("\n");
    text = text.replace(/```json|```/g, "").trim();
    const result = JSON.parse(text);
    renderResearchResult(result);
  }catch(err){
    resultArea.innerHTML = `<div class="empty err">分析に失敗しました: ${err.message}</div>`;
  }finally{
    researchBtn.disabled = false;
  }
});

function renderResearchResult(result){
  let html = '';
  html += '<div class="section-label">// Summary</div>';
  html += `<div class="analysis-block"><p>${escapeHtml(result.summary||'')}</p></div>`;

  html += '<div class="section-label">// Factors</div>';
  html += '<div class="factor-list" style="margin-bottom:22px;">';
  (result.factors||[]).forEach(f => {
    html += `<div class="factor-item"><p class="f-label">${escapeHtml(f.label||'')}</p><p>${escapeHtml(f.body||'')}</p></div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// Title Pattern</div>';
  html += `<div class="analysis-block"><p>${escapeHtml(result.title_pattern||'')}</p></div>`;

  html += '<div class="section-label">// Takeaways</div>';
  html += `<div class="analysis-block"><p>${escapeHtml(result.takeaways||'')}</p></div>`;

  resultArea.innerHTML = html;
}

genBtn.addEventListener('click', async () => {
  const genre = document.getElementById('genre').value.trim();
  const topic = document.getElementById('topic').value.trim();
  const duration = document.getElementById('duration').value;
  const audience = document.getElementById('audience').value.trim();
  const reference = document.getElementById('reference').value.trim();

  if(!topic){
    resultArea.innerHTML = '<div class="empty err">「題材・ネタの概要」は必須です。</div>';
    return;
  }

  genBtn.disabled = true;
  resultArea.innerHTML = '<div class="loading">構成案を生成中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  const prompt = `あなたはショート動画・切り抜き動画のバズる構成を専門とする編集プランナーです。
以下の条件から、バズりやすい動画構成案を1つ作成してください。

ジャンル/カテゴリ: ${genre || '(指定なし)'}
題材・ネタの概要: ${topic}
想定尺: ${duration}
ターゲット層: ${audience || '(指定なし)'}
参考にしたい要素: ${reference || '(指定なし)'}

必ず以下のJSON形式のみで出力してください。前置きや説明、コードブロックの記号は一切付けないでください。

{
  "titles": ["タイトル案1", "タイトル案2", "タイトル案3", "タイトル案4"],
  "clips": [
    {
      "time": "0:00-0:03",
      "label": "フック",
      "isHook": true,
      "description": "冒頭で視聴者を止めるための具体的なセリフ/展開案",
      "tags": ["テロップ案", "効果音案"]
    }
  ],
  "tips": [
    { "title": "サムネのポイント", "body": "具体的な提案" },
    { "title": "投稿のコツ", "body": "具体的な提案" }
  ]
}

clipsは想定尺に応じて4〜7個程度、時系列順に。各clipのtagsにはテロップ・効果音・BGMの方向性を短く含めてください。`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    let text = data.content.map(b => b.text || "").join("\n");
    text = text.replace(/```json|```/g, "").trim();
    const result = JSON.parse(text);
    renderResult(result);
  }catch(err){
    resultArea.innerHTML = `<div class="empty err">生成に失敗しました: ${err.message}</div>`;
  }finally{
    genBtn.disabled = false;
  }
});

function renderResult(result){
  let html = '';

  html += '<div class="section-label">// Title Ideas</div>';
  html += '<div class="titles">';
  (result.titles || []).forEach(t => {
    html += `<div class="title-chip">${escapeHtml(t)}</div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// Timeline</div>';
  html += '<div class="timeline">';
  (result.clips || []).forEach(c => {
    html += `<div class="clip ${c.isHook ? 'hook' : ''}">
      <div class="clip-time">${escapeHtml(c.time || '')}</div>
      <div>
        <p class="clip-title">${escapeHtml(c.label || '')}</p>
        <p class="clip-desc">${escapeHtml(c.description || '')}</p>
        <div class="clip-tags">${(c.tags||[]).map(tag=>`<span>${escapeHtml(tag)}</span>`).join('')}</div>
      </div>
    </div>`;
  });
  html += '</div>';

  html += '<div class="section-label">// Tips</div>';
  html += '<div class="tips-grid">';
  (result.tips || []).forEach(t => {
    html += `<div class="tip-card"><h3>${escapeHtml(t.title||'')}</h3><p>${escapeHtml(t.body||'')}</p></div>`;
  });
  html += '</div>';

  resultArea.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
